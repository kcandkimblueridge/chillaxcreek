name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh reviews daily at 09:00 UTC (~5am ET) and rebuild
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Refresh reviews from OwnerRez
        env:
          OWNERREZ_EMAIL: ${{ secrets.OWNERREZ_EMAIL }}
          OWNERREZ_PAT: ${{ secrets.OWNERREZ_PAT }}
        run: node scripts/scrape-reviews.mjs

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
